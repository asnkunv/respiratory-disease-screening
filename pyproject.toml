[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "respiratory-disease-screening"
version = "0.1.0"
description = "EDA and modeling pipeline for respiratory disease screening from cough audio (COUGHVID_v3, TB_screen, West China)"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
]
profiling = [
    "ydata-profiling>=4.6",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
]

# --------------------------------------------------------------------------
# This is the part that makes `from utils.eda_utils import ...` work in
# notebooks and elsewhere without any sys.path manipulation. It tells
# setuptools that importable packages live under src/, not at the project
# root, and to auto-discover any package (a folder with __init__.py) inside it.
# --------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"